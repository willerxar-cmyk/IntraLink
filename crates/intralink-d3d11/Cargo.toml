[package]
name = "intralink-d3d11"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
readback = ["dep:windows", "dep:windows-capture", "dep:anyhow"]
nvenc-preview = ["readback", "dep:mini-nvcodec", "dep:mini-cuda", "dep:libloading", "windows/Win32_Security", "windows/Win32_System_Threading", "windows/Win32_Graphics_Direct3D_Fxc", "windows/Win32_Graphics_Gdi", "windows/Win32_System_LibraryLoader", "windows/Win32_System_JobObjects"]

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = ["Win32_UI_WindowsAndMessaging"] }
windows-capture = { workspace = true, optional = true }
mini-nvcodec = { version = "=0.1.0", optional = true }
mini-cuda = { version = "=0.1.1", optional = true }
libloading = { version = "=0.9.0", optional = true }

# Only this platform adapter may call native COM APIs. Portable crates and
# the application retain their workspace-wide unsafe_code = "forbid" policy.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
