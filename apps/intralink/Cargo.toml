[package]
name = "intralink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["jpeg-simd"]
# Weak feature: the non-desktop build does not pull in a JPEG encoder.
jpeg-simd = ["jpeg-encoder?/simd"]
# Optional local MCU-row worker path; no native or wire dependency.
jpeg-parallel = []
desktop-preview = ["dep:xcap", "dep:image", "dep:minifb", "dep:fast_image_resize", "dep:jpeg-encoder"]
wgc-preview = ["desktop-preview", "dep:windows-capture", "dep:intralink-d3d11"]
nvenc-preview = ["wgc-preview", "intralink-d3d11/nvenc-preview"]
# Opt-in foreground Windows input sharing, independent of WGC and CUDA.
input-preview = ["desktop-preview", "dep:intralink-input-win", "dep:tempfile"]
# Explicit X11 receiving host and focused controller pad; independent of video capture and GPU.
input-x11-preview = ["dep:intralink-input-x11"]
vaapi-probe = ["dep:libva"]
resource-monitor = ["dep:sysinfo", "dep:serde_json", "dep:serde"]

[dependencies]
anyhow.workspace = true
mdns-sd.workspace = true
qrcode.workspace = true
clap.workspace = true
iroh.workspace = true
tokio.workspace = true
reqwest.workspace = true
rpassword.workspace = true
zeroize.workspace = true
intralink-core.workspace = true
intralink-transport.workspace = true
intralink-vault.workspace = true
directories.workspace = true
fs2.workspace = true
sysinfo = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
xcap = { workspace = true, optional = true }
image = { workspace = true, optional = true }
jpeg-encoder = { workspace = true, optional = true }
fast_image_resize = { workspace = true, optional = true }
minifb = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = { workspace = true, optional = true }
intralink-d3d11 = { workspace = true, optional = true, features = ["readback"] }
intralink-input-win = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
intralink-input-x11 = { path = "../../crates/intralink-input-x11", optional = true }
libva = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "emulator_screen_acceptance"
required-features = ["desktop-preview"]
