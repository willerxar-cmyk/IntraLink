name: Android pairing candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Verify SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo fmt --all -- --check
      - name: Host diagnostic engine tests
        run: |
          cargo clippy --locked -p intralink-android --all-targets -- -D warnings
          cargo test --locked -p intralink-android
      - name: Strict native Clippy and Release, both ABIs
        run: python3 tools/build_android_native.py apps/android/app/build/generated/jniLibs --clippy
      - name: Build application and actual JNI instrumentation APK
        shell: bash
        run: |
          bash apps/android/gradlew -p apps/android :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest :app:lintDebug :app:writeRuntimeDependencyInventory --console=plain --warning-mode all
      - name: Preserve native and JVM notice provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fetch --locked
          mkdir -p dist
          python3 tools/release_inventory.py dist/android-arm64-notices.zip --platform android-arm64
          python3 tools/release_inventory.py dist/android-x86_64-notices.zip --platform android-x86_64
          python3 tools/android_jvm_notices.py apps/android/app/build/reports/runtime-dependencies.json dist/android-jvm-notices.zip
      - name: Validate candidate without pretending to sign a release
        run: |
          python3 -B tools/validate_android_candidate.py dist/android-pairing-candidate --notices dist/android-arm64-notices.zip dist/android-x86_64-notices.zip dist/android-jvm-notices.zip
      - uses: actions/upload-artifact@v4
        with:
          name: intralink-android-pairing-${{ github.sha }}
          path: dist/android-pairing-candidate/
          if-no-files-found: error
      # No production keys or automatic public release. Device tests are separate.
