name: Linux X11 input candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - name: Install X11 development and isolated display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-xtest0-dev xvfb xauth xkb-data pkg-config libclang-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libx11-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Strict lint and adapter tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p intralink-input-x11 --all-targets -- -D warnings
          cargo test --locked -p intralink-input-x11
      - name: Exercise actual XTEST input and stop on a disposable X server
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1024x768x24 -nolisten tcp" sh -c 'export INTRALINK_X11_TEST_DISPLAY="$DISPLAY"; cargo test --locked -p intralink-input-x11 native_xvfb_ -- --ignored --nocapture --test-threads=1'
      - name: Qualify CPU-only Linux input workspace and host
        run: |
          cargo clippy --locked -p intralink --no-default-features --features input-x11-preview --all-targets -- -D warnings
          cargo test --locked -p intralink --no-default-features --features input-x11-preview
      - name: Qualify combined portable desktop and X11 input
        run: |
          set -euo pipefail
          features=desktop-preview,jpeg-simd,jpeg-parallel,resource-monitor,input-x11-preview
          graph="$(cargo tree --locked -p intralink --no-default-features --features "$features" -e normal --prefix none)"
          if grep -Eq '^mini-(cuda|nvcodec) ' <<< "$graph"; then
            echo "NVIDIA codec dependency leaked into portable build" >&2
            exit 1
          fi
          cargo clippy --locked -p intralink --no-default-features --features "$features" --all-targets -- -D warnings
          cargo test --locked -p intralink --no-default-features --features "$features"
          cargo build --locked --release -p intralink --no-default-features --features "$features"
          target/release/intralink --version
          target/release/intralink input host --help
          target/release/intralink input workspace --help
          ldd target/release/intralink | tee linux-runtime-libraries.txt
          if grep -q 'not found' linux-runtime-libraries.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: intralink-linux-x11-build-only-${{ github.sha }}
          path: |
            target/release/intralink
            linux-runtime-libraries.txt
          if-no-files-found: error
      - name: Inventory and package the exact X11 input candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fetch --locked
          python tools/release_inventory.py x11-notices.zip --platform linux --x11-input-preview
          python tools/package_desktop_candidate.py --platform linux --x11-input-preview --binary target/release/intralink --notices x11-notices.zip --output x11-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: intralink-linux-x11-candidate-${{ github.sha }}
          path: x11-candidate/
          if-no-files-found: error
      # No public release. Physical KVM and real window manager stop behavior
      # must be qualified separately. License provenance review remains open.
