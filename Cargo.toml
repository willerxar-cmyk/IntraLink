[workspace]
members = ["crates/intralink-core", "crates/intralink-transport", "crates/intralink-vault", "crates/intralink-d3d11", "crates/intralink-input-win", "apps/intralink"]
resolver = "3"

[workspace.package]
version = "0.22.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
mdns-sd = "=0.21.7"
qrcode = { version = "0.14.1", default-features = false }
clap = { version = "4.5", features = ["derive"] }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rpassword = "7"
zeroize = "1"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
fs2 = "0.4.3"
directories = "6"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "=0.7.1" }
fast_image_resize = { version = "=6.2.0", features = ["only_u8x4"] }
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
intralink-d3d11 = { path = "crates/intralink-d3d11" }
intralink-input-win = { path = "crates/intralink-input-win" }
xcap = "=0.9.10"
minifb = "=0.29.0"
sysinfo = { version = "=0.40.4", default-features = false, features = ["system"] }
libva = { package = "cros-libva", version = "=0.0.13" }
intralink-vault = { path = "crates/intralink-vault" }
intralink-core = { path = "crates/intralink-core" }
intralink-transport = { path = "crates/intralink-transport" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
